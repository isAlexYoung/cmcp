name: Validate CMCP

on:
  push:
    branches: [main, codex/ui-card-dashboard, codex/macos-parity]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/node-version.txt
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tests/browser-fixture/package-lock.json
      - name: Install locked build dependencies
        shell: pwsh
        run: |
          npm --prefix app ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix tests/browser-fixture ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Get-Command node.exe).Source -Destination app/runtime/node.exe
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          @{node=(node --version);sha='${{ github.sha }}';note='Missing test result files mean those tests were not executed.'} | ConvertTo-Json | Set-Content test-results/environment.json -Encoding utf8
      - name: Parse PowerShell and verify versions
        shell: pwsh
        run: |
          $files = @(Get-ChildItem app -Filter '*.ps1') + @(Get-ChildItem tools -Filter '*.ps1') + @(Get-ChildItem app/tests -Filter '*.ps1')
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors.Message -join '; ') }
          }
          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          $lock = Get-Content app/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($package.version -ne $lock['version'] -or $package.version -ne $lock['packages']['']['version']) { throw 'Version mismatch' }
      - name: Node authentication, reconnect and independent-target tests
        shell: pwsh
        run: |
          node --test app/tests/reconnect.test.mjs app/tests/shared-session.test.mjs app/tests/terminal-link.test.mjs app/tests/target-connections.test.mjs app/tests/shared-auto.test.mjs app/tests/request-recovery.test.mjs | Tee-Object test-results/node.tap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tap = Get-Content test-results/node.tap -Raw
          if ($tap -notmatch '# pass 49' -or $tap -notmatch '# fail 0' -or $tap -notmatch '# skipped 0') { throw 'Incomplete Node regression' }
      - name: Windows PowerShell 5.1 selected-target regression
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/tests/target-controls.test.ps1 | Set-Content test-results/powershell.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content test-results/powershell.json -Raw | ConvertFrom-Json
          if ($r.passed -ne 20 -or $r.failed -ne 0 -or $r.skipped -ne 0) { throw 'Incomplete PowerShell regression' }
      - name: Offline platform update and rollback boundaries
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/tests/update.test.ps1 | Set-Content test-results/updater.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content test-results/updater.json -Raw | ConvertFrom-Json
          if ($r.passed -ne 40 -or $r.failed -ne 0 -or $r.skipped -ne 0) { throw 'Incomplete update regression' }
      - name: Startup preference registration isolation
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/tests/startup-settings.test.ps1 | Set-Content test-results/startup-settings.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content test-results/startup-settings.json -Raw | ConvertFrom-Json
          if ($r.passed -ne 6 -or $r.failed -ne 0 -or $r.skipped -ne 0) { throw 'Incomplete startup preference regression' }
      - name: Real external update helper against disposable executables
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/tests/update-apply.test.ps1 | Set-Content test-results/update-apply.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content test-results/update-apply.json -Raw | ConvertFrom-Json
          if ($r.passed -ne 8 -or $r.failed -ne 0 -or $r.skipped -ne 0) { throw 'Incomplete external update helper regression' }
      - name: Build and exercise real WinForms and Shell shortcuts
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build-manager.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resultFile = Join-Path $PWD 'test-results/manager.json'
          $p = Start-Process -FilePath (Join-Path $PWD 'Claude-MCP.exe') -ArgumentList ('--self-test "' + $resultFile + '"') -WindowStyle Hidden -PassThru -RedirectStandardError (Join-Path $PWD 'test-results/manager.stderr.txt')
          if (!$p.WaitForExit(60000)) { $p.Kill(); Get-Content ($resultFile + '.progress.txt') -ErrorAction SilentlyContinue; throw 'Manager self-test timed out' }
          if ($p.ExitCode -ne 0) { Get-Content ($resultFile + '.progress.txt') -ErrorAction SilentlyContinue; Get-Content ($resultFile + '.unhandled.txt') -ErrorAction SilentlyContinue; Get-Content test-results/manager.stderr.txt -ErrorAction SilentlyContinue; Get-Content $resultFile -ErrorAction SilentlyContinue; throw ('Manager self-test failed with exit ' + $p.ExitCode) }
          $r = Get-Content $resultFile -Raw | ConvertFrom-Json
          if ($r.passed -ne 166 -or $r.failed -ne 0 -or $r.skipped -ne 0 -or $r.not_executed.Count -ne 3) { throw 'Incomplete manager regression' }
      - name: Full application exit stops every target
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/tests/manager-exit.test.ps1 -EvidenceDirectory test-results/exit | Set-Content test-results/manager-exit.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content test-results/manager-exit.json -Raw | ConvertFrom-Json
          if ($r.passed -ne 8 -or $r.failed -ne 0 -or $r.skipped -ne 0) { throw 'Incomplete application exit regression' }
      - name: Manager edit and delete isolation
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/tests/manager-targets.test.ps1 | Set-Content test-results/manager-targets.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content test-results/manager-targets.json -Raw | ConvertFrom-Json
          if ($r.passed -ne 19 -or $r.failed -ne 0 -or $r.skipped -ne 0) { throw 'Incomplete manager target mutation regression' }
      - name: Inline actions, cancellation and embedded save isolation
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/tests/manager-inline.test.ps1 -EvidenceDirectory test-results/inline | Set-Content test-results/manager-inline.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content test-results/manager-inline.json -Raw | ConvertFrom-Json
          if ($r.passed -ne 27 -or $r.failed -ne 0 -or $r.skipped -ne 0) { throw 'Incomplete inline action regression' }
      - name: Shared automatic login encrypted save boundaries
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/tests/shared-auto-save.test.ps1 | Set-Content test-results/shared-auto-save.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content test-results/shared-auto-save.json -Raw | ConvertFrom-Json
          if ($r.passed -ne 18 -or $r.failed -ne 0 -or $r.skipped -ne 0) { throw 'Incomplete automatic login credential regression' }
      - name: Silent manager backend restart and state preservation
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/tests/manager-restart.test.ps1 -EvidenceDirectory test-results/restart | Set-Content test-results/restart-stdout.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content test-results/restart/restart.json -Raw | ConvertFrom-Json
          if ($r.passed -ne 15 -or $r.failed -ne 0 -or $r.skipped -ne 0) { throw 'Incomplete silent backend restart regression' }
      - name: Real isolated browser shared automatic login
        shell: pwsh
        run: |
          node tools/test-shared-auto-browser.mjs test-results/shared-auto-browser | Set-Content test-results/shared-auto-browser-stdout.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content test-results/shared-auto-browser/browser.json -Raw | ConvertFrom-Json
          if ($r.passed -ne 12 -or $r.failed -ne 0 -or $r.skipped -ne 0) { throw 'Incomplete real browser automatic login regression' }
      - name: Capture real WinForms layouts
        shell: pwsh
        run: |
          foreach ($case in @(@('light',1100,720,'light','idle'),@('hover',1100,720,'light','hover'),@('dark',1100,720,'dark','idle'),@('narrow',660,580,'light','hover'),@('editor',1100,720,'light','editor'),@('editor-dark',660,580,'dark','editor'),@('add',1100,720,'light','add'),@('progress',1100,720,'light','progress'),@('settings',1100,720,'light','settings'),@('settings-en',660,580,'dark','settings-en'),@('about',1100,720,'light','about'))) {
            $imageFile = Join-Path $PWD ('test-results/' + $case[0] + '.png')
            $arguments = '--preview "' + $imageFile + '" ' + $case[1] + ' ' + $case[2] + ' ' + $case[3] + ' ' + $case[4]
            $p = Start-Process -FilePath (Join-Path $PWD 'Claude-MCP.exe') -ArgumentList $arguments -WindowStyle Hidden -PassThru
            if (!$p.WaitForExit(15000)) { $p.Kill(); throw 'Preview capture timed out' }
            if ($p.ExitCode -ne 0 -or !(Test-Path -LiteralPath $imageFile)) { throw 'Preview capture failed' }
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build-manager.ps1 -PreviewOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable package
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/package-manager.ps1 -OutputDirectory "$env:RUNNER_TEMP/cmcp-packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmcp-test-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: error

      - name: Preserve versioned package
        uses: actions/upload-artifact@v4
        with:
          name: cmcp-windows-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cmcp-packages/*.zip
            ${{ runner.temp }}/cmcp-packages/*.sha256
          if-no-files-found: error

  linux-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/node-version.txt
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - name: Real Unix socket reconnect and request protection
        run: |
          mkdir -p test-results
          python -m unittest discover -s app/tests -p 'test_request_recovery.py' -v 2>&1 | tee test-results/python-recovery.txt
          test ${PIPESTATUS[0]} -eq 0
          grep -q 'Ran 16 tests' test-results/python-recovery.txt
          ! grep -q 'skipped' test-results/python-recovery.txt
      - name: Full connector relay and Windows-client protocol recovery
        shell: bash
        run: node --test app/tests/recovery-unix.integration.mjs | tee test-results/recovery-integration.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmcp-linux-recovery-${{ github.sha }}
          path: test-results/
